<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#3B82F6" rx="80"/>
  
  <!-- Main circle (pocket watch) -->
  <circle cx="256" cy="256" r="160" fill="#F8FAFC" stroke="#1E293B" stroke-width="8"/>
  
  <!-- Watch hands (showing time like a clock) -->
  <line x1="256" y1="256" x2="256" y2="160" stroke="#DC2626" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="320" y2="256" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="256" cy="256" r="12" fill="#1E293B"/>
  
  <!-- Hour markers -->
  <circle cx="256" cy="120" r="8" fill="#1E293B"/>
  <circle cx="392" cy="256" r="8" fill="#1E293B"/>
  <circle cx="256" cy="392" r="8" fill="#1E293B"/>
  <circle cx="120" cy="256" r="8" fill="#1E293B"/>
  
  <!-- Performance graph indicator -->
  <path d="M 180 320 Q 220 280 260 300 Q 300 280 340 300" 
        stroke="#10B981" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Small dots for data points -->
  <circle cx="200" cy="310" r="3" fill="#10B981"/>
  <circle cx="240" cy="290" r="3" fill="#10B981"/>
  <circle cx="280" cy="290" r="3" fill="#10B981"/>
  <circle cx="320" cy="300" r="3" fill="#10B981"/>
  
  <!-- HP text -->
  <text x="256" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#F8FAFC">HP</text>
</svg>